# This workflow helps you trigger a SonarCloud analysis of your code and populates
# GitHub Code Scanning alerts with the vulnerabilities found.
# Free for open source project.

# 1. Login to SonarCloud.io using your GitHub account

# 2. Import your project on SonarCloud
#     * Add your GitHub organization first, then add your repository as a new project.
#     * Please note that many languages are eligible for automatic analysis,
#       which means that the analysis will start automatically without the need to set up GitHub Actions.
#     * This behavior can be changed in Administration > Analysis Method.
#
# 3. Follow the SonarCloud in-product tutorial
#     * a. Copy/paste the Project Key and the Organization Key into the args parameter below
#          (You'll find this information in SonarCloud. Click on "Information" at the bottom left)
#
#     * b. Generate a new token and add it to your Github repository's secrets using the name SONAR_TOKEN
#          (On SonarCloud, click on your avatar on top-right > My account > Security
#           or go directly to https://sonarcloud.io/account/security/)

# Feel free to take a look at our documentation (https://docs.sonarcloud.io/getting-started/github/)
# or reach out to our community forum if you need some help (https://community.sonarsource.com/c/help/sc/9)

name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results

jobs:
  Sonar-Analysis-and-Report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'maven'
      - name: Jacoco Report and SonarCloud Analysis
        id: analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Generate a token on Sonarcloud.io, add it to the secrets of this repo with the name SONAR_TOKEN (Settings > Secrets > Actions > add new repository secret)
        run: |
          export DISPLAY=:99
          sudo Xvfb -ac :99 -screen 0 1280x1024x24 > /dev/null 2>&1 &
          sudo apt-get update
          sudo apt-get install -y libblosc-dev
          if [ -n "$SONAR_TOKEN" ]; then
            mvn -B -ntp verify --file pom.xml -Pcoverage sonar:sonar -Dsonar.projectKey=BioImageTools_ome-zarr-fiji-java -Dsonar.organization=bioimagetools
          else
            # GitHub withholds secrets from pull_request runs of fork PRs. Build everything the scanner needs
            # (classes, coverage, library jars) and hand it to sonarcloud-fork-pr.yml, which runs with secrets
            # but never executes the fork's code.
            # Library jars for sonar.java.libraries: all of compile scope, but only the direct test dependencies
            # (the full test scope is ~400 MB). Both runs need a lifecycle phase, or the sibling ome.zarr modules
            # would be looked up in the (empty) local repository instead of the reactor.
            DEP="org.apache.maven.plugins:maven-dependency-plugin:copy-dependencies -DoutputDirectory=$PWD/target/sonar-libs -DexcludeGroupIds=ome.zarr"
            mvn -B -ntp verify --file pom.xml -Pcoverage $DEP -DincludeScope=compile
            mvn -B -ntp package --file pom.xml -DskipTests $DEP -DincludeScope=test -DexcludeTransitive=true
            echo "${{ github.event.pull_request.number }}" > target/sonar-pr-number
            echo "fork=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload build output for the fork PR SonarCloud analysis
        if: steps.analysis.outputs.fork == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sonar-fork-pr
          retention-days: 1
          path: |
            target/sonar-pr-number
            target/sonar-libs
            ome-zarr-*/target/classes
            ome-zarr-*/target/test-classes
            ome-zarr-coverage-report/target/site/jacoco-aggregate/jacoco.xml

      - name: Upload artifacts for subsequent review
        uses: actions/upload-artifact@master
        with:
          name: generated-reports
          path: |
            target/site
            target/dependency-check-report.html
